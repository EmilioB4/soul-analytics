name: Daily summary validation
on:
  pull_request:
    paths:
      - 'lib/walmart-daily*'
      - 'lib/walmart-sale*'
      - 'tests/walmart-sale*'
      - 'app/api/notifications/sales/**'
      - 'app/WalmartDailySummary.tsx'
      - 'app/page.tsx'
      - 'app/api/notifications/daily/**'
      - 'supabase/walmart_daily_summary.sql'
      - 'scripts/validate-walmart-daily*'
      - '.github/workflows/daily-summary.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: node --experimental-strip-types --test tests/walmart-sale-image.test.mjs tests/walmart-sale-message.test.mjs tests/walmart-sale-routes.test.mjs
      - run: node scripts/validate-walmart-daily-summary.cjs
      - run: node scripts/validate-walmart-daily-sql.cjs
      - run: npm run test:isolation
      - run: npm run test:sale-alerts
      - run: npm run build
