name: Connections and eBay validation
on:
  pull_request:
    paths:
      - 'app/Ebay*'
      - 'app/ConnectionCheck.tsx'
      - 'app/api/connections/verify/**'
      - 'tests/connection-checks.test.mjs'
      - 'app/WalmartConnection.tsx'
      - 'app/WhatnotConnection.tsx'
      - 'app/api/ebay/**'
      - 'app/page.tsx'
      - 'lib/ebay*'
      - 'package.json'
      - 'supabase/ebay*.sql'
      - 'tests/ebay*'
      - 'scripts/validate-ebay*.cjs'
      - '.github/workflows/ebay.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: node --experimental-strip-types --test tests/ebay-orders.test.mjs tests/ebay-routes.test.mjs tests/ebay-api.test.mjs tests/connection-checks.test.mjs tests/ebay-deletion.test.mjs tests/ebay-finances.test.mjs tests/ebay-listings.test.mjs tests/ebay-series.test.mjs
      - run: node scripts/validate-ebay.cjs
      - run: node scripts/validate-ebay-deletion.cjs
      - run: node scripts/validate-ebay-finances.cjs
      - run: npm run test:isolation
      - run: npm run build
